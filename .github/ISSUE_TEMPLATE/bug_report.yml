name: Bug report
description: Something in DockBeacon is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please remove secrets (AUTH_SECRET, passwords, tokens) from anything you paste.
  - type: input
    id: version
    attributes:
      label: DockBeacon version
      description: Shown next to the logo in the header, or `dpkg -s docker-log-viewer | grep Version` / `rpm -q docker-log-viewer`
      placeholder: v0.6.5
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [standalone, agent, control plane with agents]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and install method
      placeholder: Ubuntu 24.04, apt / Amazon Linux 2023, install.sh
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: textarea
    id: logs
    attributes:
      label: Service logs
      description: Output of `sudo journalctl -u docker-log-viewer -n 50 --no-pager`
      render: text
  - type: dropdown
    id: proxy
    attributes:
      label: Behind a reverse proxy?
      options: [No, nginx, Caddy, Traefik, Other]
